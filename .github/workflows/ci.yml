name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core + shellcheck + fish
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install bats-core shellcheck fish
          else
            sudo apt-get update
            sudo apt-get install -y bats shellcheck fish
          fi

      - name: shellcheck
        run: shellcheck bin/ccws lib/*.sh share/init.sh install.sh uninstall.sh

      - name: bats — unit
        run: bats tests/unit/

      - name: bats — integration
        run: bats tests/integration/

      - name: bats — e2e
        run: bats tests/e2e/
