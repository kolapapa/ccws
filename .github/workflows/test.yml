name: tests

on:
  push:
  pull_request:

jobs:
  vitest:
    name: vitest (bun)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Build host binary (required by integration tests)
        run: bun run build:host
      - name: Run vitest (unit + integration)
        run: bun run test

  build-verify:
    name: build-verify (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        run: bun install
      - name: Cross-compile
        run: |
          suffix="${{ matrix.target }}"
          suffix="${suffix#bun-}"
          bun build --compile --target=${{ matrix.target }} --minify \
            src/index.ts --outfile dist/ccws-$suffix
          file dist/ccws-$suffix
