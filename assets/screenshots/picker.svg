<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="winclip">
      <rect x="20" y="20" width="840" height="500" rx="10"/>
    </clipPath>
    <style>
      .t   { fill:#cdd6f4; font-size:13px; }
      .mu  { fill:#7f849c; }
      .gn  { fill:#a6e3a1; }
      .yl  { fill:#f9e2af; }
      .rd  { fill:#f38ba8; }
      .mv  { fill:#cba6f7; }
      .pk  { fill:#f5c2e7; }
      .sk  { fill:#89dceb; }
      .lv  { fill:#b4befe; }
      .pc  { fill:#fab387; }
      .bl  { fill:#89b4fa; }
      .b   { font-weight:600; }
    </style>
  </defs>

  <!-- window with shadow -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="840" height="500" rx="10" fill="#1e1e2e"/>
  </g>

  <!-- header bar -->
  <g clip-path="url(#winclip)">
    <rect x="20" y="20" width="840" height="36" fill="#181825"/>
  </g>
  <circle cx="44" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="38" r="6" fill="#27c93f"/>
  <text x="440" y="42" text-anchor="middle" font-size="11" fill="#6c7086">ccws — interactive picker</text>

  <!-- content -->
  <g transform="translate(48,80)">
    <!-- logo (6 rows, gradient) -->
    <text class="t mv b" x="0" y="0">   ██████╗ ██████╗██╗    ██╗███████╗</text>
    <text class="t pk b" x="0" y="18">  ██╔════╝██╔════╝██║    ██║██╔════╝</text>
    <text class="t lv b" x="0" y="36">  ██║     ██║     ██║ █╗ ██║███████╗</text>
    <text class="t sk b" x="0" y="54">  ██║     ██║     ██║███╗██║╚════██║</text>
    <text class="t gn b" x="0" y="72">  ╚██████╗╚██████╗╚███╔███╔╝███████║</text>
    <text class="t yl b" x="0" y="90">   ╚═════╝ ╚═════╝ ╚══╝╚══╝ ╚══════╝</text>

    <!-- divider -->
    <text class="t mu" x="0" y="116">────────────────────────────────────────────────────────────────────────────────</text>

    <!-- hint -->
    <text class="t mu" x="0" y="136">  <tspan class="lv">↑↓</tspan> navigate    type to filter    <tspan class="gn">↵</tspan> activate    <tspan class="yl">Tab</tspan> toggle yolo    <tspan class="rd">esc</tspan> cancel</text>

    <!-- prompt -->
    <text class="t" x="0" y="170">  <tspan class="mv">›</tspan> <tspan class="mu">_</tspan></text>
    <text class="t mu" x="720" y="170">3/3</text>

    <!-- selected row highlight -->
    <rect x="-8" y="190" width="800" height="22" rx="3" fill="#45475a"/>

    <!-- workspace rows -->
    <text class="t" x="0" y="206"><tspan class="gn b">❯ default</tspan>       <tspan class="mu">anthropic</tspan>                  <tspan class="gn">●</tspan> proxy   <tspan class="yl">!</tspan> yolo   <tspan class="sk">·</tspan> home   <tspan class="gn b">· active</tspan></text>
    <text class="t" x="0" y="228">  personal       <tspan class="mu">anthropic</tspan>                  <tspan class="gn">●</tspan> proxy   <tspan class="mu">·</tspan> safe</text>
    <text class="t" x="0" y="250">  deepseek       <tspan class="mu">deepseek-gw</tspan>                <tspan class="mu">○</tspan> direct  <tspan class="mu">·</tspan> safe</text>

    <!-- divider -->
    <text class="t mu" x="0" y="278">────────────────────────────────────────────────────────────────────────────────</text>

    <!-- preview pane -->
    <text class="t mu" x="0" y="304">  preview · default</text>
    <text class="t" x="0" y="328">  <tspan class="lv">CLAUDE_CONFIG_DIR</tspan>     <tspan class="mu">~/.claude</tspan></text>
    <text class="t" x="0" y="350">  <tspan class="lv">ANTHROPIC_BASE_URL</tspan>    <tspan class="sk">https://api.anthropic.com</tspan></text>
    <text class="t" x="0" y="372">  <tspan class="lv">ANTHROPIC_AUTH_TOKEN</tspan>  <tspan class="rd">***</tspan></text>
    <text class="t" x="0" y="394">  <tspan class="lv">CCWS_NO_ISOLATE</tspan>       <tspan class="yl">1</tspan></text>

    <!-- footer hint -->
    <text class="t mu" x="0" y="430">  Launch <tspan class="gn">claude</tspan> now? <tspan class="yl">[Y/n]</tspan></text>
  </g>
</svg>
